<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GTA VI Tracker</title>
  <style>
    body {
      background-color: #0b0710;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* BLURRED LOCAL BACKGROUND IMAGE (.jpeg) */
    .background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('background.jpeg');
      background-size: cover;
      background-position: center;
      filter: blur(10px) brightness(0.7);
      transform: scale(1.1);
      z-index: -3;
    }

    /* LOCAL LOGO (TOP LEFT) */
    .logo-container {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
    }
    .logo-container img {
      width: 150px;
      height: auto;
    }

    /* TRICKLING RAINDROPS LAYER */
    #rain {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
    }

    /* MAIN CONTENT */
    .main-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100%;
      z-index: 5;
    }

    h1 {
      font-size: 3rem;
      background: linear-gradient(45deg, #ff007f, #ff8c00, #9b51e0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .subtitle {
      color: #ccc;
      margin-bottom: 20px;
      font-size: 0.9rem;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }
    .countdown-container {
      display: flex;
      gap: 15px;
      margin: 20px 0;
    }
    .time-box {
      background: rgba(11, 7, 16, 0.6);
      border: 1px solid #ff007f;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.3);
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      min-width: 70px;
      backdrop-filter: blur(2px);
    }
    .time-box span {
      display: block;
      font-size: 2.5rem;
      font-weight: bold;
      color: #ff8c00;
    }
    .label {
      font-size: 0.8rem;
      text-transform: uppercase;
      color: #ccc;
    }
    .tracker-section {
      width: 100%;
      max-width: 600px;
      margin-top: 30px;
      background: rgba(20, 15, 30, 0.9);
      border-radius: 10px;
      padding: 20px;
      border: 1px solid #332244;
    }
    .tracker-title {
      color: #ff007f;
      border-bottom: 2px solid #ff007f;
      padding-bottom: 5px;
    }
    ul { list-style: none; padding: 0; }
    li {
      padding: 10px;
      border-bottom: 1px solid #221533;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    input[type="checkbox"] { accent-color: #ff007f; transform: scale(1.3); }
  </style>
</head>
<body>

  <!-- Blurred Background Image -->
  <div class="background"></div>

  <!-- Local Logo (.webp) -->
  <div class="logo-container">
    <img src="logo.webp" alt="GTA VI Logo">
  </div>

  <!-- Raindrops Canvas Layer -->
  <canvas id="rain"></canvas>

  <!-- Main Content -->
  <div class="main-content">
    <h1>Grand Theft Auto VI</h1>
    <p class="subtitle">Launch Target: Nov 18, 2026 at 10:00 PM PDT</p>

    <div class="countdown-container">
      <div class="time-box"><span id="days">00</span><div class="label">Days</div></div>
      <div class="time-box"><span id="hours">00</span><div class="label">Hours</div></div>
      <div class="time-box"><span id="minutes">00</span><div class="label">Mins</div></div>
      <div class="time-box"><span id="seconds">00</span><div class="label">Secs</div></div>
    </div>

    <div class="tracker-section">
      <h3 class="tracker-title">My Checklist & Notes</h3>
      <ul>
        <li><input type="checkbox"> Watch Official Trailers</li>
        <li><input type="checkbox"> Pre-order Game</li>
        <li><input type="checkbox"> Clear SSD Storage Space</li>
      </ul>
    </div>
  </div>

  <script>
    // --- Countdown Timer Logic ---
    const releaseDate = new Date('2026-11-18T22:00:00-07:00').getTime();

    function updateTimer() {
      const now = new Date().getTime();
      const distance = releaseDate - now;

      if (distance < 0) {
        document.querySelector('.countdown-container').innerHTML = "<h2 style='color: #ff8c00;'>THE GAME IS OUT!</h2>";
        return;
      }

      const d = Math.floor(distance / (1000 * 60 * 60 * 24));
      const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const s = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById('days').innerText = d < 10 ? '0' + d : d;
      document.getElementById('hours').innerText = h < 10 ? '0' + h : h;
      document.getElementById('minutes').innerText = m < 10 ? '0' + m : m;
      document.getElementById('seconds').innerText = s < 10 ? '0' + s : s;
    }
    setInterval(updateTimer, 1000);
    updateTimer();

    // --- Raindrops Logic ---
    const canvas = document.getElementById('rain');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let rain = [];
    class Drop {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = -100;
        this.vy = Math.random() * 5 + 5;
        this.len = Math.random() * 10 + 10;
      }
      draw() {
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.x, this.y + this.len);
        ctx.strokeStyle = 'rgba(174, 194, 224, 0.3)';
        ctx.lineWidth = 1;
        ctx.lineCap = 'round';
        ctx.stroke();
      }
      update() {
        this.y += this.vy;
        if (this.y > canvas.height) {
          this.y = -100;
          this.x = Math.random() * canvas.width;
        }
      }
    }

    function initRain() {
      for (let i = 0; i < 150; i++) {
        rain.push(new Drop());
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      rain.forEach(drop => {
        drop.update();
        drop.draw();
      });
      requestAnimationFrame(animate);
    }

    initRain();
    animate();

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      rain = [];
      initRain();
    });
  </script>
</body>
</html>
