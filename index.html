<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GTA VI Tracker</title>
  
  <!-- FAVICON -->
  <link rel="icon" type="image/webp" href="logo.webp">

  <!-- IMPORTS GTA STYLE & CALLIGRAPHIC FONTS -->
  <link href="https://fonts.cdnfonts.com/css/pricedown" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Alex+Brush&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #0b0710;
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('background.jpeg');
      background-size: cover;
      background-position: center;
      filter: blur(12px) brightness(0.6);
      transform: scale(1.1);
      z-index: -3;
    }

    .logo-container {
      position: absolute;
      top: 35px;
      left: 25px;
      z-index: 10;
      background-color: #ffffff;
      padding: 8px 12px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-container img {
      width: 130px;
      height: auto;
      display: block;
    }

    #rain {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
    }

    .main-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      width: 100%;
      z-index: 5;
      padding: 40px 0 20px 0;
      box-sizing: border-box;
    }

    h1 {
      font-family: 'Pricedown', sans-serif;
      font-size: 4rem;
      text-transform: uppercase;
      background: linear-gradient(45deg, #ff007f, #ff8c00, #9b51e0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0px;
      letter-spacing: 2px;
      filter: drop-shadow(0px 4px 12px rgba(0, 0, 0, 0.95)) drop-shadow(0px 2px 4px rgba(0, 0, 0, 1));
      text-align: center;
    }

    .subtitle {
      color: #e0e0e0;
      margin-bottom: 25px;
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 700;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
    }

    .countdown-container {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
    }
    .time-box {
      background: rgba(11, 7, 16, 0.65);
      border: 1px solid rgba(255, 0, 127, 0.4);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      padding: 16px;
      border-radius: 12px;
      text-align: center;
      min-width: 75px;
      backdrop-filter: blur(8px);
    }
    .time-box span {
      display: block;
      font-family: 'Impact', 'Arial Black', sans-serif;
      font-size: 2.8rem;
      color: #ff8c00;
      letter-spacing: 1px;
      text-shadow: 0 0 10px rgba(255, 140, 0, 0.3);
    }
    .label {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.7rem;
      text-transform: uppercase;
      color: #aaa;
      letter-spacing: 1px;
      font-weight: 600;
      margin-top: 2px;
    }

    .cards-wrapper {
      display: flex;
      gap: 20px;
      width: 90%;
      max-width: 900px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .glass-card {
      flex: 1;
      min-width: 320px;
      max-width: 440px;
      background: rgba(15, 10, 25, 0.55);
      border-radius: 16px;
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .card-title {
      color: #ffffff;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 800;
    }
    .card-stats {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #d8d8d8;
      letter-spacing: 0.5px;
    }
    .pink-dot {
      width: 6px;
      height: 6px;
      background-color: #ff007f;
      border-radius: 50%;
      box-shadow: 0 0 8px #ff007f;
      display: inline-block;
    }

    ul { list-style: none; padding: 0; margin: 0; }

    .check-item {
      display: flex;
      align-items: center;
      padding: 12px 14px;
      margin-bottom: 8px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.03);
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .check-item:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 0, 127, 0.3);
    }
    .check-item input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-radius: 6px;
      outline: none;
      cursor: pointer;
      margin-right: 14px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .check-item input[type="checkbox"]:checked {
      background-color: #ff007f;
      border-color: #ff007f;
      box-shadow: 0 0 8px rgba(255, 0, 127, 0.6);
    }
    .check-item input[type="checkbox"]:checked::after {
      content: '';
      width: 5px;
      height: 10px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
      margin-bottom: 2px;
    }
    .check-item span {
      font-size: 0.85rem;
      color: #d8d8d8;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .check-item input[type="checkbox"]:checked + span {
      text-decoration: line-through;
      color: #666;
    }

    .news-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 240px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .news-list::-webkit-scrollbar {
      width: 4px;
    }
    .news-list::-webkit-scrollbar-thumb {
      background: rgba(255, 0, 127, 0.5);
      border-radius: 4px;
    }
    .news-item {
      display: flex;
      flex-direction: column;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.03);
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .news-item:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 0, 127, 0.3);
    }
    .news-header-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .news-source {
      font-size: 0.65rem;
      text-transform: uppercase;
      font-weight: 800;
      color: #ff8c00;
      letter-spacing: 0.5px;
    }
    .news-date {
      font-size: 0.65rem;
      color: #888;
    }
    .news-title-text {
      font-size: 0.8rem;
      color: #e0e0e0;
      font-weight: 600;
      line-height: 1.25;
    }
    .loading-text {
      font-size: 0.8rem;
      color: #888;
      text-align: center;
      padding: 20px 0;
    }

    /* PLAIN FOOTER CALLIGRAPHY (NO GLOW) */
    .footer-calligraphy {
      font-family: 'Alex Brush', cursive;
      font-size: 1.8rem;
      color: #ffffff;
      margin-top: 35px;
      letter-spacing: 1px;
      text-shadow: none;
      filter: none;
      user-select: none;
    }
  </style>
</head>
<body>

  <div class="background"></div>

  <div class="logo-container">
    <img src="logo.webp" alt="GTA VI Logo">
  </div>

  <canvas id="rain"></canvas>

  <div class="main-content">
    <h1>GRAND THEFT AUTO VI</h1>
    <p class="subtitle">Launch Date: Nov 18, 2026 at 10:00 PM</p>

    <div class="countdown-container">
      <div class="time-box"><span id="days">00</span><div class="label">Days</div></div>
      <div class="time-box"><span id="hours">00</span><div class="label">Hours</div></div>
      <div class="time-box"><span id="minutes">00</span><div class="label">Mins</div></div>
      <div class="time-box"><span id="seconds">00</span><div class="label">Secs</div></div>
    </div>

    <div class="cards-wrapper">
      <div class="glass-card">
        <div class="card-header">
          <span class="card-title">Progress Tracker</span>
          <div class="card-stats">
            <span id="remaining-count">0/3</span>
            <span class="pink-dot"></span>
            <span id="progress-percent">0%</span>
          </div>
        </div>
        <ul>
          <label class="check-item">
            <input type="checkbox" onchange="updateProgress()">
            <span>Watch Official Trailers</span>
          </label>
          <label class="check-item">
            <input type="checkbox" onchange="updateProgress()">
            <span>Pre-order Game</span>
          </label>
          <label class="check-item">
            <input type="checkbox" onchange="updateProgress()">
            <span>Clear SSD Storage Space</span>
          </label>
        </ul>
      </div>

      <div class="glass-card">
        <div class="card-header">
          <span class="card-title">Verified Updates</span>
          <div class="card-stats">
            <span>LIVE BACKEND</span>
            <span class="pink-dot"></span>
          </div>
        </div>
        <div class="news-list" id="news-container">
          <div class="loading-text">Connecting to private backend server...</div>
        </div>
      </div>
    </div>

    <div class="footer-calligraphy">Raise mayhem...</div>
  </div>

  <script>
    // Set for Nov 18, 2026 at 22:00:00 (10:00 PM)
    const releaseDate = new Date('2026-11-18T22:00:00').getTime();

    function updateTimer() {
      const now = new Date().getTime();
      const distance = releaseDate - now;

      if (distance < 0) {
        document.querySelector('.countdown-container').innerHTML = "<h2 style='color: #ff8c00;'>THE GAME IS OUT!</h2>";
        return;
      }

      const d = Math.floor(distance / (1000 * 60 * 60 * 24));
      const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const s = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById('days').innerText = d < 10 ? '0' + d : d;
      document.getElementById('hours').innerText = h < 10 ? '0' + h : h;
      document.getElementById('minutes').innerText = m < 10 ? '0' + m : m;
      document.getElementById('seconds').innerText = s < 10 ? '0' + s : s;
    }
    setInterval(updateTimer, 1000);
    updateTimer();

    function updateProgress() {
      const checkboxes = document.querySelectorAll('.check-item input[type="checkbox"]');
      const total = checkboxes.length;
      let checked = 0;
      const savedStates = [];

      checkboxes.forEach((cb) => {
        savedStates.push(cb.checked);
        if (cb.checked) checked++;
      });

      localStorage.setItem('gtavi_checklist_states', JSON.stringify(savedStates));
      const percent = Math.round((checked / total) * 100);

      document.getElementById('remaining-count').innerText = `${checked}/${total}`;
      document.getElementById('progress-percent').innerText = `${percent}%`;
    }

    function loadSavedProgress() {
      const saved = localStorage.getItem('gtavi_checklist_states');
      if (saved) {
        const states = JSON.parse(saved);
        const checkboxes = document.querySelectorAll('.check-item input[type="checkbox"]');
        checkboxes.forEach((cb, index) => {
          if (states[index] !== undefined) {
            cb.checked = states[index];
          }
        });
      }
      updateProgress();
    }
    loadSavedProgress();

    // --- PRIVATE BACKEND ENGINE LINKED TO RENDER ---
    const BACKEND_URL = 'https://gta-backend-vy4k.onrender.com/api/news';

    async function fetchBackendNews() {
      const container = document.getElementById('news-container');
      try {
        const res = await fetch(BACKEND_URL);
        const data = await res.json();

        if (data.success && data.articles.length > 0) {
          container.innerHTML = '';
          data.articles.forEach(item => {
            const dateObj = new Date(item.pubDate);
            const formattedDate = dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

            const newsEl = document.createElement('a');
            newsEl.className = 'news-item';
            newsEl.href = item.link;
            newsEl.target = '_blank';
            newsEl.rel = 'noopener noreferrer';

            newsEl.innerHTML = `
              <div class="news-header-meta">
                <span class="news-source">${item.source || 'Verified News'}</span>
                <span class="news-date">${formattedDate}</span>
              </div>
              <div class="news-title-text">${item.title}</div>
            `;
            container.appendChild(newsEl);
          });
        } else {
          container.innerHTML = `<div class="loading-text">No verified news at this moment.</div>`;
        }
      } catch (err) {
        container.innerHTML = `<div class="loading-text">Server connecting... (Please check backend URL)</div>`;
      }
    }

    fetchBackendNews();
    setInterval(fetchBackendNews, 5 * 60 * 1000);

    // --- GLASS RAIN PHYSICS ---
    const canvas = document.getElementById('rain');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const staticBeads = Array.from({ length: 400 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 2.5 + 0.8,
      alpha: Math.random() * 0.4 + 0.2
    }));

    class SlowWindowDrop {
      constructor() { this.reset(true); }

      reset(initial = false) {
        this.x = Math.random() * canvas.width;
        this.y = initial ? Math.random() * canvas.height : -30;
        this.r = Math.random() * 2.8 + 2.0;
        this.vy = 0;
        this.vx = 0;
        this.speedLimit = Math.random() * 0.8 + 0.4;
        this.isTrickling = initial ? (Math.random() < 0.15) : (Math.random() < 0.35);
        this.accumulation = Math.random() * 100; 
        this.threshold = Math.random() * 250 + 150;
        this.pauseTimer = 0;
        this.trail = [];
        this.wigglePhase = Math.random() * Math.PI * 2;
        this.wiggleFrequency = Math.random() * 0.04 + 0.01;
      }

      update() {
        if (!this.isTrickling) {
          this.accumulation += 0.2;
          if (this.accumulation >= this.threshold) this.isTrickling = true;
          return;
        }

        if (this.pauseTimer > 0) {
          this.pauseTimer--;
          this.vy = 0;
          this.vx = 0;
        } else {
          this.vy += 0.03;
          if (this.vy > this.speedLimit) this.vy = this.speedLimit;

          this.wigglePhase += this.wiggleFrequency;
          this.vx = Math.sin(this.wigglePhase) * 0.3;

          if (Math.random() < 0.015) {
            this.pauseTimer = Math.floor(Math.random() * 80 + 30);
          }
        }

        this.x += this.vx;
        this.y += this.vy;

        if (this.vy > 0.1 && Math.random() < 0.3) {
          this.trail.push({
            x: this.x + (Math.random() - 0.5) * (this.r * 0.4),
            y: this.y - this.r * 0.4,
            r: Math.random() * (this.r * 0.35) + 0.6,
            alpha: 0.45
          });
        }

        for (let i = 0; i < this.trail.length; i++) {
          this.trail[i].alpha -= 0.002;
          if (this.trail[i].alpha <= 0) {
            this.trail.splice(i, 1);
            i--;
          }
        }

        if (this.y > canvas.height + 40) this.reset();
      }

      draw() {
        for (let i = 0; i < this.trail.length; i++) {
          const t = this.trail[i];
          ctx.beginPath();
          ctx.fillStyle = `rgba(190, 215, 245, ${t.alpha})`;
          ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2);
          ctx.fill();
        }

        const x = this.x;
        const y = this.y;
        const r = this.r;

        ctx.beginPath();
        ctx.fillStyle = 'rgba(10, 15, 25, 0.4)';
        ctx.arc(x, y + 0.8, r + 0.4, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.fillStyle = 'rgba(215, 235, 255, 0.55)';
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.arc(x - r * 0.3, y - r * 0.3, r * 0.28, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    const windowDrops = Array.from({ length: 60 }, () => new SlowWindowDrop());

    function renderGlassWater() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      staticBeads.forEach(b => {
        ctx.beginPath();
        ctx.fillStyle = `rgba(0, 0, 0, ${b.alpha * 0.5})`;
        ctx.arc(b.x, b.y + 0.6, b.r + 0.3, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.fillStyle = `rgba(200, 225, 255, ${b.alpha})`;
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
      });

      windowDrops.forEach(drop => {
        drop.update();
        drop.draw();
      });

      requestAnimationFrame(renderGlassWater);
    }

    renderGlassWater();

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
