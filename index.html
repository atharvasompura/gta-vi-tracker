<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GTA VI Tracker</title>
  
  <!-- IMPORTS GTA STYLE FONTS -->
  <link href="https://fonts.cdnfonts.com/css/pricedown" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #0b0710;
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* BLURRED BACKGROUND IMAGE */
    .background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('background.jpeg');
      background-size: cover;
      background-position: center;
      filter: blur(12px) brightness(0.6);
      transform: scale(1.1);
      z-index: -3;
    }

    /* LOGO CONTAINER */
    .logo-container {
      position: absolute;
      top: 35px;
      left: 25px;
      z-index: 10;
      background-color: #ffffff;
      padding: 8px 12px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-container img {
      width: 130px;
      height: auto;
      display: block;
    }

    /* GLASS RAIN CANVAS */
    #rain {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
    }

    /* MAIN CONTENT */
    .main-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100%;
      z-index: 5;
    }

    /* GTA PRICEDOWN TITLE - ALL CAPS */
    h1 {
      font-family: 'Pricedown', sans-serif;
      font-size: 4rem;
      text-transform: uppercase;
      background: linear-gradient(45deg, #ff007f, #ff8c00, #9b51e0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0px;
      letter-spacing: 2px;
      filter: drop-shadow(0px 4px 12px rgba(0, 0, 0, 0.95)) drop-shadow(0px 2px 4px rgba(0, 0, 0, 1));
      text-align: center;
    }

    .subtitle {
      color: #e0e0e0;
      margin-bottom: 25px;
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 700;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
    }

    /* COUNTDOWN TIMER */
    .countdown-container {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
    }
    .time-box {
      background: rgba(11, 7, 16, 0.65);
      border: 1px solid rgba(255, 0, 127, 0.4);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      padding: 16px;
      border-radius: 12px;
      text-align: center;
      min-width: 75px;
      backdrop-filter: blur(8px);
    }
    .time-box span {
      display: block;
      font-family: 'Pricedown', sans-serif;
      font-size: 2.8rem;
      color: #ff8c00;
      text-shadow: 0 0 10px rgba(255, 140, 0, 0.3);
    }
    .label {
      font-size: 0.7rem;
      text-transform: uppercase;
      color: #aaa;
      letter-spacing: 1px;
      font-weight: 600;
      margin-top: 2px;
    }

    /* TRACKER CARD */
    .tracker-section {
      width: 90%;
      max-width: 440px;
      background: rgba(15, 10, 25, 0.55);
      border-radius: 16px;
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    }

    /* TRACKER HEADER WITH DYNAMIC STATS & PINK DOT */
    .tracker-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .tracker-title {
      color: #ffffff;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 800;
    }
    .tracker-stats {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #d8d8d8;
      letter-spacing: 0.5px;
    }
    .pink-dot {
      width: 6px;
      height: 6px;
      background-color: #ff007f;
      border-radius: 50%;
      box-shadow: 0 0 8px #ff007f;
      display: inline-block;
    }

    ul { list-style: none; padding: 0; margin: 0; }

    .check-item {
      display: flex;
      align-items: center;
      padding: 12px 14px;
      margin-bottom: 8px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.03);
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .check-item:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 0, 127, 0.3);
    }

    /* PERFECTLY CENTERED CHECKBOXES */
    .check-item input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-radius: 6px;
      outline: none;
      cursor: pointer;
      margin-right: 14px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .check-item input[type="checkbox"]:checked {
      background-color: #ff007f;
      border-color: #ff007f;
      box-shadow: 0 0 8px rgba(255, 0, 127, 0.6);
    }
    .check-item input[type="checkbox"]:checked::after {
      content: '';
      width: 5px;
      height: 10px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
      margin-bottom: 2px;
    }
    .check-item span {
      font-size: 0.85rem;
      color: #d8d8d8;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: color 0.2s ease;
    }
    .check-item input[type="checkbox"]:checked + span {
      text-decoration: line-through;
      color: #666;
    }
  </style>
</head>
<body>

  <div class="background"></div>

  <div class="logo-container">
    <img src="logo.webp" alt="GTA VI Logo">
  </div>

  <canvas id="rain"></canvas>

  <div class="main-content">
    <h1>GRAND THEFT AUTO VI</h1>
    <p class="subtitle">Launch Date: Nov 18, 2026 at 10:00 PM PDT</p>

    <div class="countdown-container">
      <div class="time-box"><span id="days">00</span><div class="label">Days</div></div>
      <div class="time-box"><span id="hours">00</span><div class="label">Hours</div></div>
      <div class="time-box"><span id="minutes">00</span><div class="label">Mins</div></div>
      <div class="time-box"><span id="seconds">00</span><div class="label">Secs</div></div>
    </div>

    <div class="tracker-section">
      <div class="tracker-header">
        <span class="tracker-title">Progress Tracker</span>
        <div class="tracker-stats">
          <span id="remaining-count">0/3</span>
          <span class="pink-dot"></span>
          <span id="progress-percent">0%</span>
        </div>
      </div>
      <ul>
        <label class="check-item">
          <input type="checkbox" onchange="updateProgress()">
          <span>Watch Official Trailers</span>
        </label>
        <label class="check-item">
          <input type="checkbox" onchange="updateProgress()">
          <span>Pre-order Game</span>
        </label>
        <label class="check-item">
          <input type="checkbox" onchange="updateProgress()">
          <span>Clear SSD Storage Space</span>
        </label>
      </ul>
    </div>
  </div>

  <script>
    // --- Countdown Timer Logic ---
    const releaseDate = new Date('2026-11-18T22:00:00-07:00').getTime();

    function updateTimer() {
      const now = new Date().getTime();
      const distance = releaseDate - now;

      if (distance < 0) {
        document.querySelector('.countdown-container').innerHTML = "<h2 style='color: #ff8c00;'>THE GAME IS OUT!</h2>";
        return;
      }

      const d = Math.floor(distance / (1000 * 60 * 60 * 24));
      const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const s = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById('days').innerText = d < 10 ? '0' + d : d;
      document.getElementById('hours').innerText = h < 10 ? '0' + h : h;
      document.getElementById('minutes').innerText = m < 10 ? '0' + m : m;
      document.getElementById('seconds').innerText = s < 10 ? '0' + s : s;
    }
    setInterval(updateTimer, 1000);
    updateTimer();

    // --- Dynamic Progress Calculator ---
    function updateProgress() {
      const checkboxes = document.querySelectorAll('.check-item input[type="checkbox"]');
      const total = checkboxes.length;
      let checked = 0;

      checkboxes.forEach(cb => {
        if (cb.checked) checked++;
      });

      const percent = Math.round((checked / total) * 100);

      document.getElementById('remaining-count').innerText = `${checked}/${total}`;
      document.getElementById('progress-percent').innerText = `${percent}%`;
    }

    // --- PHOTOREALISTIC GLASS RAIN SIMULATION ---
    const canvas = document.getElementById('rain');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // Static condensed glass beads
    const staticBeads = Array.from({ length: 350 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.8 + 0.6,
      alpha: Math.random() * 0.35 + 0.15
    }));

    // Dynamic Sliding Water Rivulets
    class GlassStreak {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * canvas.width;
        this.y = -30;
        this.r = Math.random() * 2.2 + 1.2;
        this.vy = 0;
        this.speedLimit = Math.random() * 3 + 1.5;
        this.streak = [];
        this.pauseTimer = Math.random() * 40;
      }

      update() {
        if (this.pauseTimer > 0) {
          this.pauseTimer--;
          this.vy = 0;
        } else {
          this.vy += 0.15;
          if (this.vy > this.speedLimit) this.vy = this.speedLimit;

          // Occasionally pause due to glass friction
          if (Math.random() < 0.015) {
            this.pauseTimer = Math.random() * 30 + 10;
          }
        }

        this.y += this.vy;

        // Leave narrow, realistic wet trail points behind
        if (this.vy > 0.2) {
          this.streak.push({
            x: this.x + (Math.random() - 0.5) * 0.5,
            y: this.y,
            w: this.r * 0.8,
            alpha: 0.25
          });
        }

        // Decay streak opacity gradually
        for (let i = 0; i < this.streak.length; i++) {
          this.streak[i].alpha -= 0.0015;
          if (this.streak[i].alpha <= 0) {
            this.streak.splice(i, 1);
            i--;
          }
        }

        if (this.y > canvas.height + 40) this.reset();
      }

      draw() {
        // Draw trailing wet streak on window pane
        for (let i = 0; i < this.streak.length; i++) {
          const s = this.streak[i];
          ctx.beginPath();
          ctx.fillStyle = `rgba(220, 235, 255, ${s.alpha})`;
          ctx.rect(s.x - s.w / 2, s.y, s.w, 2);
          ctx.fill();
        }

        // Draw leading water drop (tear shape refract effect)
        ctx.beginPath();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fill();

        // Highlight glint
        ctx.beginPath();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.arc(this.x - this.r * 0.3, this.y - this.r * 0.3, this.r * 0.25, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    const streaks = Array.from({ length: 45 }, () => new GlassStreak());

    function animateRain() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Render stationary droplets
      staticBeads.forEach(b => {
        ctx.beginPath();
        ctx.fillStyle = `rgba(210, 230, 255, ${b.alpha})`;
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
      });

      // Render rivulets
      streaks.forEach(s => {
        s.update();
        s.draw();
      });

      requestAnimationFrame(animateRain);
    }

    animateRain();

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
