<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GTA VI Tracker</title>
  <style>
    body {
      background-color: #0b0710;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* BLURRED BACKGROUND IMAGE */
    .background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('background.jpeg');
      background-size: cover;
      background-position: center;
      filter: blur(12px) brightness(0.65);
      transform: scale(1.1);
      z-index: -3;
    }

    /* LOGO IN ROUNDED WHITE BOX (MOVED DOWN ~3mm) */
    .logo-container {
      position: absolute;
      top: 35px; /* Shifted down */
      left: 25px;
      z-index: 10;
      background-color: #ffffff;
      padding: 8px 12px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-container img {
      width: 130px;
      height: auto;
      display: block;
    }

    /* TRICKLING GLASS RAIN CANVAS */
    #rain {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
    }

    /* MAIN CONTENT WRAPPER */
    .main-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100%;
      z-index: 5;
    }

    /* MAIN TITLE WITH DROP SHADOW FOR READABILITY */
    h1 {
      font-size: 3.2rem;
      background: linear-gradient(45deg, #ff007f, #ff8c00, #9b51e0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 3px;
      filter: drop-shadow(0px 4px 12px rgba(0, 0, 0, 0.95)) drop-shadow(0px 2px 4px rgba(0, 0, 0, 1));
      text-align: center;
    }

    .subtitle {
      color: #e0e0e0;
      margin-bottom: 25px;
      font-size: 0.95rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 500;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
    }

    /* COUNTDOWN TIMER STYLING */
    .countdown-container {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
    }
    .time-box {
      background: rgba(11, 7, 16, 0.65);
      border: 1px solid rgba(255, 0, 127, 0.4);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      padding: 16px;
      border-radius: 12px;
      text-align: center;
      min-width: 75px;
      backdrop-filter: blur(8px);
    }
    .time-box span {
      display: block;
      font-size: 2.5rem;
      font-weight: 700;
      color: #ff8c00;
      text-shadow: 0 0 10px rgba(255, 140, 0, 0.3);
    }
    .label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: #aaa;
      letter-spacing: 1px;
      margin-top: 4px;
    }

    /* MINIMALIST & AESTHETIC CHECKLIST CARD */
    .tracker-section {
      width: 90%;
      max-width: 440px;
      background: rgba(15, 10, 25, 0.55);
      border-radius: 16px;
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    }
    .tracker-title {
      color: #ffffff;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin: 0 0 18px 0;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .tracker-title::after {
      content: '';
      flex-grow: 1;
      height: 1px;
      background: linear-gradient(90deg, #ff007f, transparent);
      margin-left: 15px;
    }

    ul { list-style: none; padding: 0; margin: 0; }

    /* CUSTOM CHECKLIST ITEM LAYOUT */
    .check-item {
      display: flex;
      align-items: center;
      padding: 12px 14px;
      margin-bottom: 8px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.03);
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .check-item:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 0, 127, 0.3);
    }

    /* CUSTOM AESTHETIC CHECKBOX */
    .check-item input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-radius: 5px;
      outline: none;
      cursor: pointer;
      margin-right: 14px;
      position: relative;
      transition: all 0.2s ease;
    }
    .check-item input[type="checkbox"]:checked {
      background-color: #ff007f;
      border-color: #ff007f;
      box-shadow: 0 0 8px rgba(255, 0, 127, 0.6);
    }
    .check-item input[type="checkbox"]:checked::after {
      content: '✓';
      position: absolute;
      color: white;
      font-size: 12px;
      top: -1px;
      left: 3px;
      font-weight: bold;
    }
    .check-item span {
      font-size: 0.9rem;
      color: #d8d8d8;
      letter-spacing: 0.5px;
      transition: color 0.2s ease;
    }
    .check-item input[type="checkbox"]:checked + span {
      text-decoration: line-through;
      color: #777;
    }
  </style>
</head>
<body>

  <!-- Blurred Background -->
  <div class="background"></div>

  <!-- Logo in White Box -->
  <div class="logo-container">
    <img src="logo.webp" alt="GTA VI Logo">
  </div>

  <!-- Window Rain Canvas -->
  <canvas id="rain"></canvas>

  <!-- Main Content -->
  <div class="main-content">
    <h1>Grand Theft Auto VI</h1>
    <p class="subtitle">Launch Date: Nov 18, 2026 at 10:00 PM PDT</p>

    <div class="countdown-container">
      <div class="time-box"><span id="days">00</span><div class="label">Days</div></div>
      <div class="time-box"><span id="hours">00</span><div class="label">Hours</div></div>
      <div class="time-box"><span id="minutes">00</span><div class="label">Mins</div></div>
      <div class="time-box"><span id="seconds">00</span><div class="label">Secs</div></div>
    </div>

    <div class="tracker-section">
      <div class="tracker-title">Progress Tracker</div>
      <ul>
        <label class="check-item">
          <input type="checkbox">
          <span>Watch Official Trailers</span>
        </label>
        <label class="check-item">
          <input type="checkbox">
          <span>Pre-order Game</span>
        </label>
        <label class="check-item">
          <input type="checkbox">
          <span>Clear SSD Storage Space</span>
        </label>
      </ul>
    </div>
  </div>

  <script>
    // --- Countdown Timer Logic ---
    const releaseDate = new Date('2026-11-18T22:00:00-07:00').getTime();

    function updateTimer() {
      const now = new Date().getTime();
      const distance = releaseDate - now;

      if (distance < 0) {
        document.querySelector('.countdown-container').innerHTML = "<h2 style='color: #ff8c00;'>THE GAME IS OUT!</h2>";
        return;
      }

      const d = Math.floor(distance / (1000 * 60 * 60 * 24));
      const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const s = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById('days').innerText = d < 10 ? '0' + d : d;
      document.getElementById('hours').innerText = h < 10 ? '0' + h : h;
      document.getElementById('minutes').innerText = m < 10 ? '0' + m : m;
      document.getElementById('seconds').innerText = s < 10 ? '0' + s : s;
    }
    setInterval(updateTimer, 1000);
    updateTimer();


    // --- Realistic Glass Raindrops Logic ---
    const canvas = document.getElementById('rain');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    class GlassDrop {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height - canvas.height;
        this.r = Math.random() * 2.5 + 1.5; // Droplet size
        this.vy = 0; // Vertical speed (starts paused/sticky)
        this.friction = Math.random() * 0.05 + 0.92;
        this.gravity = Math.random() * 0.03 + 0.01;
        this.trail = [];
      }

      draw() {
        // Draw trailing water mark
        ctx.beginPath();
        for (let i = 0; i < this.trail.length; i++) {
          const point = this.trail[i];
          ctx.fillStyle = `rgba(200, 225, 255, ${point.alpha})`;
          ctx.arc(point.x, point.y, point.r * 0.7, 0, Math.PI * 2);
          ctx.fill();
        }

        // Draw main trickling droplet
        ctx.beginPath();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fill();

        // Droplet highlight shine
        ctx.beginPath();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.arc(this.x - this.r * 0.3, this.y - this.r * 0.3, this.r * 0.3, 0, Math.PI * 2);
        ctx.fill();
      }

      update() {
        // Simulates water sticking to glass until heavy enough
        if (Math.random() < 0.03) {
          this.vy += this.gravity * this.r;
        }

        this.vy *= this.friction;
        this.y += this.vy;

        // Leave trailing tiny water beads as it slides down
        if (this.vy > 0.5 && Math.random() < 0.3) {
          this.trail.push({
            x: this.x + (Math.random() - 0.5),
            y: this.y,
            r: this.r * 0.5,
            alpha: 0.3
          });
        }

        // Fade trails over time
        for (let i = 0; i < this.trail.length; i++) {
          this.trail[i].alpha -= 0.005;
          if (this.trail[i].alpha <= 0) {
            this.trail.splice(i, 1);
            i--;
          }
        }

        // Reset drop when off screen
        if (this.y > canvas.height + 20) {
          this.reset();
        }
      }
    }

    const drops = Array.from({ length: 80 }, () => new GlassDrop());

    function animateRain() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drops.forEach(drop => {
        drop.update();
        drop.draw();
      });
      requestAnimationFrame(animateRain);
    }

    animateRain();

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
